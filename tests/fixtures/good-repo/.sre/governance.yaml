# Declared governance posture (attested by the team; verified in CI via GitHub API).
governance:
  branch_protection:
    enabled: true
    required_reviewers: 2
  require_signed_commits: true
  audit_logging: true
security:
  secret_scanning: true
sre:
  error_budget_policy_defined: true
  disaster_recovery:
    rpo: 4h
    rto: 8h
    test_cadence: quarterly
    last_tested: 2026-10-01
  toil_budget_pct: 50
  oncall_defined: true
