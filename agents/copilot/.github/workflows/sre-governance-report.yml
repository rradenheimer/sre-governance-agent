name: SRE Governance Report

on:
  workflow_run:
    workflows: ["SRE Governance"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Download governance reports
        uses: actions/download-artifact@v4.1.3
        with:
          name: sre-governance-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: sre-reports

      - name: Resolve SARIF ref
        id: sarif-ref
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          if [ "$PULL_REQUESTS" != "[]" ]; then
            number=$(python -c 'import json, os; print(json.loads(os.environ["PULL_REQUESTS"])[0]["number"])')
            echo "ref=refs/pull/$number/merge" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/heads/$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF
        if: hashFiles('sre-reports/**/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sre-reports/**/*.sarif
          sha: ${{ github.event.workflow_run.head_sha }}
          ref: ${{ steps.sarif-ref.outputs.ref }}

      - name: Comment report on PR
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = 'sre-reports/sre-governance-report.md';
            if (!fs.existsSync(report)) return;
            const body = fs.readFileSync(report, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.workflow_run.pull_requests[0].number,
              body: body.slice(0, 65000),
            });
