name: SRE Governance

# Runs the deterministic policy engine on every PR and on a schedule, uploads a
# SARIF report to the Security tab, comments the Markdown report on the PR, and
# enforces the policy gate according to the repo's industry profile.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"   # weekly Monday 07:00 UTC continuous-monitoring sweep

permissions:
  contents: read
  pull-requests: write
  security-events: write    # required to upload SARIF

concurrency:
  group: sre-governance-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  governance-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: rradenheimer/sre-governance-agent
          ref: v1.0.0
          path: sre-governance-engine
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install pyyaml

      - name: Resolve profile
        id: profile
        shell: bash
        run: |
          PROFILE=""
          if [ -f .sre/profile ]; then PROFILE=$(cat .sre/profile | tr -d '[:space:]'); fi
          if [ -z "$PROFILE" ]; then PROFILE="commercial"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Resolved industry profile: $PROFILE"

      - name: Run governance scan
        id: scan
        shell: bash
        run: |
          set +e
          PYTHONPATH=sre-governance-engine/src python -m sre_governance.cli scan \
            --repo . \
            --profile "${{ steps.profile.outputs.profile }}" \
            --catalog sre-governance-engine/config/control-catalog.yaml \
            --profiles-dir sre-governance-engine/config/industry-profiles \
            --format all \
            --out sre-reports \
            --audit .sre/audit.jsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify audit chain
        run: PYTHONPATH=sre-governance-engine/src python -m sre_governance.cli verify-audit --audit .sre/audit.jsonl

      - name: Policy-as-code gate (OPA/Rego with Python fallback, advisory)
        continue-on-error: true
        run: |
          python scripts/opa_gate.py --report sre-reports/sre-governance-report.json

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sre-reports/sre-governance.sarif
        continue-on-error: true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-governance-reports
          path: |
            sre-reports/
            .sre/audit.jsonl
            .sre/audit.jsonl.head

      - name: Prepare durable audit artifact
        if: always()
        run: tar -czf "$RUNNER_TEMP/audit-chain.tar.gz" .sre/audit.jsonl .sre/audit.jsonl.head

      - name: Persist audit chain for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-governance-audit
          path: ${{ runner.temp }}/audit-chain.tar.gz
          if-no-files-found: error

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sre-reports/sre-governance-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000),
            });

      - name: Enforce policy gate
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::SRE governance policy gate failed under blocking enforcement."
          exit 1
