name: SRE Governance

# Runs the deterministic policy engine on every PR and on a schedule, uploads a
# SARIF report to the Security tab, comments the Markdown report on the PR, and
# enforces the policy gate according to the repo's industry profile.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"   # weekly Monday 07:00 UTC continuous-monitoring sweep
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write    # required to upload SARIF

jobs:
  governance-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install pyyaml

      - name: Resolve profile
        id: profile
        shell: bash
        run: |
          PROFILE=""
          if [ -f .sre/profile ]; then PROFILE=$(cat .sre/profile | tr -d '[:space:]'); fi
          if [ -z "$PROFILE" ]; then PROFILE="commercial"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Resolved industry profile: $PROFILE"

      - name: Run governance scan
        id: scan
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m sre_governance.cli scan \
            --repo . \
            --profile "${{ steps.profile.outputs.profile }}" \
            --format all \
            --out sre-reports \
            --audit .sre/audit.jsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify audit chain
        run: PYTHONPATH=src python -m sre_governance.cli verify-audit --audit .sre/audit.jsonl

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sre-reports/sre-governance.sarif
        continue-on-error: true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-governance-reports
          path: |
            sre-reports/
            .sre/audit.jsonl

      - name: Comment report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('sre-reports/sre-governance-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000),
            });

      - name: Enforce policy gate
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::SRE governance policy gate failed under blocking enforcement."
          exit 1
