name: SRE Governance Fleet Report

# Aggregates governance JSON reports across many repositories into an org-wide
# dashboard. Run on a schedule by a central governance repo. Reports are gathered
# either from a committed `fleet-artifacts/` directory (one JSON per repo) or by
# a preceding job/script that downloads them from each repo's CI artifacts.

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install pyyaml

      - name: Aggregate fleet
        env:
          SRE_GOVERNANCE_REPORTS_DIR: ${{ vars.SRE_GOVERNANCE_REPORTS_DIR }}
        run: |
          DIR="${SRE_GOVERNANCE_REPORTS_DIR:-fleet-artifacts}"
          if [ ! -d "$DIR" ]; then
            echo "::warning::No reports directory '$DIR' found; nothing to aggregate."
            exit 0
          fi
          PYTHONPATH=src python scripts/fleet_aggregate.py aggregate \
            --reports-dir "$DIR" --out fleet-reports

      - name: Publish fleet dashboard to job summary
        if: always()
        run: |
          if [ -f fleet-reports/fleet-dashboard.md ]; then
            cat fleet-reports/fleet-dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload fleet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-governance-fleet
          path: fleet-reports/
