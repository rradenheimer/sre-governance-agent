name: Scan Observability

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitoring dependency
        run: pip install -r requirements.txt
      - name: Evaluate scan availability SLO
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m sre_governance.monitor
