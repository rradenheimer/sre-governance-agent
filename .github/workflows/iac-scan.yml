name: IaC Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan GitHub Actions CI/CD configuration
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: github_actions
          soft_fail: false
