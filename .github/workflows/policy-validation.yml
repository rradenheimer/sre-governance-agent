name: Policy Validation

# Validates the control catalog and industry profiles and runs the engine's unit
# tests. This protects the governance rules themselves from regressions — the
# policies are code and are tested like code.

on:
  pull_request:
    paths:
      - "config/**"
      - "src/**"
      - "tests/**"
      - "policies/**"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml pytest
      - name: Validate catalog + profiles
        run: PYTHONPATH=src python -m sre_governance.cli validate-config
      - name: Run engine tests
        run: python -m pytest -q
      - name: Build release source archive
        run: |
          mkdir dist
          git archive --format=tar.gz --output=dist/sre-governance-agent.tar.gz \
            HEAD src config agents docs policies requirements.txt README.md LICENSE VERSION
      - name: Generate candidate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: dist/sre-governance-agent.tar.gz
          format: spdx-json
          output-file: dist/sre-governance-agent.spdx.json
      - name: Validate release SBOM
        run: |
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            dist/sre-governance-agent.spdx.json
      - name: Lint OPA policies (if conftest present)
        continue-on-error: true
        run: |
          if command -v conftest >/dev/null 2>&1; then
            conftest verify --policy policies/opa || true
          else
            echo "conftest not installed; skipping OPA verify"
          fi
